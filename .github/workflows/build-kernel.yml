# ---------------------------------------------------------------------------
# blu_spark-16-los 内核 CI
#
#   目标分支   : blu_spark-16-los (Linux 6.1.x / LineageOS 23.2 = Android 16)
#   目标设备   : Pixel 6/7/8/9 系列 (gs, Tensor G1~G4)
#   工具链     : AOSP prebuilt clang-r487747c (build.config.constants 里指定的版本)
#   KernelSU   : 默认每次构建都从 tiann/KernelSU 拉最新 main 覆盖 drivers/kernelsu；
#                同步后的 KSU 如果编不过，会自动回退到仓库内自带版本再编一次
#   产物       : AnyKernel3 刷机 zip + Image.lz4 + System.map
#
#   注意: 本仓库里 drivers/kernelsu 是 eng.stk 打过补丁的副本
#         (Kbuild 里写死 KSU_GIT_VERSION、apk_sign.c 里多一个 manager 签名)，
#         同步上游时这两处会丢失 —— 版本号在下面的构建步骤里用
#         KSU_GIT_VERSION_VALID/KSU_GIT_VERSION 从命令行补回来了。
# ---------------------------------------------------------------------------
name: Build Kernel (blu_spark-16-los)

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU ref (分支/标签/commit)，留空用 main"
        required: false
        default: "main"
      sync_ksu:
        description: "是否同步 tiann/KernelSU 最新代码"
        type: choice
        options: ["true", "false"]
        default: "true"
      release:
        description: "构建成功后创建 GitHub Release"
        type: choice
        options: ["false", "true"]
        default: "false"
      susfs:
        description: "打上 SUSFS（root 隐藏）补丁"
        type: choice
        options: ["true", "false"]
        default: "true"
      name_tag:
        description: "内核名字后缀（uname -r 末尾），留空则不加"
        required: false
        default: "shimmerfly"
      add_timestamp:
        description: "内核名字里加编译时间戳（UTC+8）"
        type: choice
        options: ["true", "false"]
        default: "true"
  push:
    branches:
      - blu_spark-16-los
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: blu_spark_defconfig
  LLVM_TAG: llvmorg-17.0.6
  LLVM_TARBALL: clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
  CLANG_DIR: /home/runner/llvm17
  KSU_REPO: https://github.com/tiann/KernelSU
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_BRANCH: gki-android14-6.1
  AK3_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler file flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 rsync unzip xz-utils \
            zip zstd
          # clang-r487747c 是较老的预编译包，某些镜像上还需要 libtinfo5
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libtinfo5 2>/dev/null || true

      - name: Free up disk space
        run: |
          set -euo pipefail
          echo "::notice title=disk-before::$(df -h / | tail -1)"
          # GitHub runner 的系统盘只有 ~14G，内核 LTO 构建很容易撑爆，
          # 先把预装的一堆用不上的 SDK 清掉（官方 runner 常用的瘦身手法）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          echo "::notice title=disk-after::$(df -h / | tail -1)"

      - name: Cache LLVM toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: ${{ env.LLVM_TAG }}-v1

      - name: Fetch LLVM ${{ env.LLVM_TAG }}
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # engstk 的 "blu_spark clang 17.0.6" 就是 LLVM 17.0.6（defconfig 里记的
          # llvm-project commit 6009708b 正是 llvmorg-17.0.6 那个 tag），所以直接用官方发布包
          rm -rf "$CLANG_DIR"
          mkdir -p "$CLANG_DIR"
          curl -fsSL -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/${LLVM_TARBALL}"
          tar -xJf /tmp/llvm.tar.xz --strip-components=1 -C "$CLANG_DIR"
          rm -f /tmp/llvm.tar.xz

      - name: Verify clang
        run: |
          set -euo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          if ! clang --version; then
            echo "::warning::clang 启动失败，尝试补一个 libtinfo.so.5 兼容链接"
            for lib in /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.6; do
              if [ -e "$lib" ]; then
                sudo ln -sf "$lib" /usr/lib/x86_64-linux-gnu/libtinfo.so.5
              fi
            done
            sudo ldconfig
            clang --version
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-

      - name: Setup ccache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ccache-shim"
          for tool in clang clang++; do
            ln -sf "$(command -v ccache)" "$HOME/ccache-shim/$tool"
          done
          ccache --max-size=3G
          ccache -z
          ccache --version | head -1

      - name: Sync KernelSU from upstream
        id: ksu
        if: github.event_name != 'workflow_dispatch' || inputs.sync_ksu == 'true'
        env:
          KSU_REF: ${{ inputs.ksu_ref || 'main' }}
        run: |
          set -uo pipefail

          fail_sync() {
            echo "::warning::$1，改用仓库内自带 KernelSU 版本"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # blob:none 的完整历史克隆：既能算出版本号(KSU_VERSION = 30000 + commit count)，
          # 又不用把全部 blob 拉下来。注意千万不能加 --depth=1，否则历史被截断、count 变成 1
          git clone -q --filter=blob:none --no-checkout "$KSU_REPO" /tmp/KernelSU \
            || fail_sync "克隆 KernelSU 失败"
          git -C /tmp/KernelSU fetch -q origin "$KSU_REF" || true
          git -C /tmp/KernelSU checkout -q --detach FETCH_HEAD 2>/dev/null \
            || git -C /tmp/KernelSU checkout -q --detach "$KSU_REF" \
            || fail_sync "检出 KernelSU ref=$KSU_REF 失败"

          KSU_COUNT=$(git -C /tmp/KernelSU rev-list --count HEAD)
          KSU_SHA=$(git -C /tmp/KernelSU rev-parse --short=12 HEAD)
          [ -n "$KSU_COUNT" ] && [ -n "$KSU_SHA" ] || fail_sync "读取 KernelSU 版本信息失败"

          echo "count=$KSU_COUNT" >> "$GITHUB_OUTPUT"
          echo "sha=$KSU_SHA" >> "$GITHUB_OUTPUT"
          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "KernelSU $KSU_REF @ $KSU_SHA (commit count $KSU_COUNT => KSU_VERSION $((30000 + KSU_COUNT)))"

          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          # 必须 -L 跟随软链：上游 kernel/include/uapi 是指向仓库根 uapi/ 的符号链接
          #（git mode 120000），用 cp -a 会照抄成断链，于是 policy/allowlist.h 的
          #   #include "uapi/app_profile.h"
          # 找不到文件，报 fatal error: 'uapi/app_profile.h' file not found。
          cp -rL /tmp/KernelSU/kernel/. drivers/kernelsu/
          if [ -f drivers/kernelsu/include/uapi/app_profile.h ]; then
            echo "::notice title=ksu-headers::include/uapi/app_profile.h 就位"
          else
            echo "::error title=ksu-headers::include/uapi/app_profile.h 缺失，软链没跟对"
          fi
          echo "--- 与仓库内版本的差异（前 20 项）---"
          git status --short drivers/kernelsu | head -20 || true

      - name: Apply SUSFS patches
        id: susfs
        if: github.event_name == 'workflow_dispatch' && inputs.susfs == 'true'
        run: |
          set -euo pipefail
          # 官方 SUSFS 仓库在 GitLab（GitHub 上同名仓库是空的），master 永久停在 v1.3.8，
          # 真正的代码在各内核版本分支里 —— 我们用 gki-android14-6.1（就是这棵树）。
          git clone -q --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" /tmp/susfs4ksu
          KP=/tmp/susfs4ksu/kernel_patches

          # 1) 内核侧：susfs.c / 头文件 + 各处 hook 补丁（已实测能干净应用在这棵树上）
          cp "$KP"/fs/* fs/
          cp "$KP"/include/linux/* include/linux/
          PATCH=$(ls "$KP"/50_add_susfs_in_*.patch | head -1)
          echo "::notice title=susfs-kernel-patch::${PATCH##*/}"
          git apply --verbose "$PATCH" || {
            echo "::error::内核侧 SUSFS 补丁应用失败（上游代码漂移？）"
            exit 1
          }

          # 2) KernelSU 侧：补丁里的路径是 kernel/xxx，而我们的 KSU 在 drivers/kernelsu/
          git apply --verbose -p2 --directory=drivers/kernelsu/ "$KP/KernelSU/10_enable_susfs_for_ksu.patch" || {
            echo "::error::KernelSU 侧 SUSFS 补丁应用失败"
            exit 1
          }

          # 3) 校验
          grep -q "susfs" fs/Makefile && echo "::notice title=susfs-fs::fs/Makefile 已挂上 susfs.o"
          grep -q "KSU_SUSFS" drivers/kernelsu/Kconfig && echo "::notice title=susfs-ksu::KSU Kconfig 已有 KSU_SUSFS"
          echo "susfs=true" >> "$GITHUB_OUTPUT"

      - name: Build kernel
        id: build
        env:
          KSU_COUNT: ${{ steps.ksu.outputs.count }}
          KSU_SYNCED: ${{ steps.ksu.outputs.synced }}
          NAME_TAG: ${{ inputs.name_tag }}
          ADD_TS: ${{ inputs.add_timestamp }}
          SUSFS_ON: ${{ steps.susfs.outputs.susfs }}
        run: |
          set -uo pipefail
          export PATH="$HOME/ccache-shim:$CLANG_DIR/bin:$PATH"
          # 说明：这棵树顶层 Makefile 被 eng.stk 定制过（KBUILD_OUTPUT := /tmp/out_gs），
          # 所以命令行不需要也不应该再传 O=，产物一律落在 objtree（下面会探测出来）。
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1"
          echo "::notice title=build-start::clang=$(clang --version | head -1) | disk=$(df -h / | tail -1)"

          # eng.stk 在仓库内 Kbuild 里写死了版本号；同步上游后要让 Kbuild
          # 仍然算出 30000 + commit count 的版本，就从命令行喂给它
          KSU_ARGS=""
          if [ -n "${KSU_COUNT:-}" ]; then
            KSU_ARGS="KSU_GIT_VERSION_VALID=1 KSU_GIT_VERSION=$KSU_COUNT"
          fi

          # ---- objtree 探测 ----
          # 内核对顶层 Makefile 有 eng.stk 的定制：KBUILD_OUTPUT := /tmp/out_gs
          #（commit 001c3b7e8 "Makefile: default build output to /tmp"，所有分支都有），
          # 所以配置/产物都在 objtree 而不是源码树里，读文件必须走这个路径。
          OUT_DIR=$(sed -n 's/^KBUILD_OUTPUT := *//p' Makefile | head -1) || OUT_DIR=""
          [ -n "$OUT_DIR" ] || OUT_DIR=/tmp/out_gs
          echo "::notice title=objtree::OUT_DIR=$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

          # ---- 配置 ----
          echo "===== $DEFCONFIG (KSU args: ${KSU_ARGS:-none}) ====="
          if ! make $MAKE_ARGS $KSU_ARGS "$DEFCONFIG" 2>&1 | tee build-config.log; then
            echo "::error::defconfig 失败"
            tail -n 60 build-config.log || true
            exit 1
          fi

          # ---- 内核名字：<版本>-<编译时间 UTC+8>-<tag> ----
          # 只动 objtree 里的 .config，仓库里的 defconfig 保持原样；想还原就把输入留空/关掉时间戳
          CFG="$OUT_DIR/.config"
          [ -f "$CFG" ] || CFG=.config
          LV=""
          if [ "${ADD_TS:-true}" = "true" ]; then
            # runner 是 UTC，这里 +8 小时换成猫猫本地时间；只用数字和连字符，Kbuild 不会炸
            LV="-$(date -u -d '+8 hours' '+%Y%m%d%H%M%S')"
          fi
          if [ -n "${NAME_TAG:-}" ]; then
            LV="${LV}-${NAME_TAG}"
          fi
          if [ -n "$LV" ]; then
            scripts/config --file "$CFG" --set-str LOCALVERSION "$LV" \
              || echo "::warning::写入 LOCALVERSION 失败"
            echo "::notice title=kernel-name::uname -r 会是 6.1.x${LV}"
          fi

          # ---- SUSFS 配置项 ----
          if [ "${SUSFS_ON:-}" = "true" ]; then
            scripts/config --file "$CFG" \
              --enable KSU_SUSFS --enable KSU_SUSFS_SUS_PATH --enable KSU_SUSFS_SUS_MOUNT \
              --enable KSU_SUSFS_SUS_KSTAT --enable KSU_SUSFS_SPOOF_UNAME --enable KSU_SUSFS_ENABLE_LOG \
              --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              --enable KSU_SUSFS_OPEN_REDIRECT --enable KSU_SUSFS_SUS_MAP \
              || echo "::warning::susfs 配置写入失败"
            make $MAKE_ARGS olddefconfig > build-olddefconfig.log 2>&1 || tail -n 20 build-olddefconfig.log || true
            echo "::notice title=susfs-config::$(grep -c '^CONFIG_KSU_SUSFS' "$CFG") 个 SUSFS 选项已启用"
          fi

          # ---- arm64 per-task stack canary 参数（修 undefined symbol: __stack_chk_guard）----
          # 内核本来在 arch/arm64/Makefile 的 recipe 里用 $(eval KBUILD_CFLAGS += ...) 注入这组参数，
          # 但 CI 上链接仍然报 __stack_chk_guard 未定义；而 CONFIG_STACKPROTECTOR_PER_TASK=y 时
          # arch/arm64/kernel/process.c 不再定义全局 __stack_chk_guard，于是每个函数都引用这个
          # 不存在的符号。这里显式补同样一组参数（偏移从 objtree 的 asm-offsets.h 取）。
          make $MAKE_ARGS prepare > build-prepare.log 2>&1 || tail -n 30 build-prepare.log || true
          CANARY_OFFSET=$(awk '{if ($2 == "TSK_STACK_CANARY") print $3}' "$OUT_DIR/include/generated/asm-offsets.h" 2>/dev/null | head -1) || CANARY_OFFSET=""
          echo "::notice title=stackprotector::offset=${CANARY_OFFSET:-空} | conf=$(grep -hE 'CONFIG_(STACKPROTECTOR|SHADOW_CALL_STACK)[A-Z_]*=y' "$OUT_DIR/include/config/auto.conf" 2>/dev/null | tr '\n' ' ')"
          if [ -n "$CANARY_OFFSET" ]; then
            CANARY_FLAGS="-mstack-protector-guard=sysreg -mstack-protector-guard-reg=sp_el0 -mstack-protector-guard-offset=$CANARY_OFFSET"
            export KCFLAGS="$CANARY_FLAGS"
            echo "::notice title=kcfgals::${CANARY_FLAGS}"
            # 只靠环境变量 KCFLAGS 实测没进编译命令，这里直接追加到树里的 Makefile（makefile 赋值必定生效）
            printf '\n# appended by CI: arm64 per-task stack canary\nKBUILD_CFLAGS += %s\n' "$CANARY_FLAGS" >> Makefile
            echo "::notice title=makefile-append::$(tail -n 1 Makefile)"
          else
            echo "::warning::读不到 TSK_STACK_CANARY 偏移，跳过 canary 参数"
          fi

          # ---- 治本：让内核永远提供全局 canary ----
          # KernelSU 的 core/init.c 只在 (MODULE && !PER_TASK) 时才定义 __stack_chk_guard，
          # 而本内核是「内建 KSU + PER_TASK=y」，于是像 arch/arm64/kvm/stacktrace.o 这种
          # 仍按 global guard 形式引用它的对象就没人提供符号 → 链接失败。
          # 这里照 KSU 注释里的思路把它补回内核自身，链接就不再依赖「编译器/LTO 是否
          # 按 sysreg 形式生成 canary」这种不可控因素了。
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && !defined(CONFIG_STACKPROTECTOR_PER_TASK)/#if defined(CONFIG_STACKPROTECTOR)/' arch/arm64/kernel/process.c
          sed -i 's/if (!IS_ENABLED(CONFIG_STACKPROTECTOR_PER_TASK))/if (IS_ENABLED(CONFIG_STACKPROTECTOR))/' arch/arm64/include/asm/stackprotector.h
          grep -q '^#if defined(CONFIG_STACKPROTECTOR)$' arch/arm64/kernel/process.c \
            && echo "::notice title=canary-patch::process.c 无条件定义 __stack_chk_guard" \
            || echo "::error title=canary-patch::process.c 补丁没打上"

          # ---- 诊断 A：prepare 之后 KBUILD_CFLAGS 里到底有没有这组参数 ----
          make $MAKE_ARGS --eval='kcflags-check: prepare ; @echo "VERIFY_KCFLAGS: $(KBUILD_CFLAGS)"' kcflags-check \
            > build-verify.log 2>&1 || true
          echo "::notice title=verify-cflags::$(grep -o -m3 -- '-mstack-protector-guard[^ ]*' build-verify.log | tr '\n' ' ')"

          # ---- 诊断 B：真实编译一个对象，打印命令行里实际出现的 canary 参数 ----
          # 注意不能用 make -n：dry-run 不会执行 recipe 里的 $(eval)，看到的命令行是不准的
          rm -f "$OUT_DIR/arch/arm64/kernel/process.o"
          make $MAKE_ARGS V=1 arch/arm64/kernel/process.o > build-oneobj.log 2>&1 || true
          COMPILE_LINE=$(grep -m1 -- "-o arch/arm64/kernel/process.o" build-oneobj.log) || COMPILE_LINE=""
          echo "::notice title=compile-guard-flags::$(printf '%s' "$COMPILE_LINE" | grep -o -m3 -- '-mstack-protector-guard[^ ]*' | tr '\n' ' ')"
          echo "::notice title=oneobj-tail::$(tail -n 2 build-oneobj.log | tr '\n' '|' | cut -c1-300)"

          run_build() {
            local tag="$1" ksu_args="$2"
            # 子 shell + tee：编译过程实时显示在 Actions 日志里，同时完整落盘到 build-$tag.log
            (
              echo "===== Image.lz4 (KSU args: ${ksu_args:-none}) ====="
              make -j"$(nproc)" $MAKE_ARGS $ksu_args Image.lz4 2>&1 | tee "build-$tag.log"
            )
          }

          rc=0
          run_build synced "$KSU_ARGS" || rc=$?

          # 只有报错确实指向 KSU 时才值得换回仓库内版本；纯粹链接/工具链问题换了也白搭
          KSU_RELATED=no
          grep -qsE "drivers/kernelsu/[^ ]+:[0-9]+:[0-9]+: (fatal )?error|drivers/kernelsu[^ ]*\.o\] Error" build-synced.log && KSU_RELATED=yes
          if [ "$rc" -ne 0 ] && [ "${KSU_SYNCED:-}" = "true" ] && [ "$KSU_RELATED" = "yes" ]; then
            echo "::warning::上游 KernelSU 编译失败，回退到仓库内自带 KSU 版本重编"
            echo "---------- 失败日志尾部 ----------"
            tail -n 60 build-synced.log || true
            echo "----------------------------------"
            git checkout -- drivers/kernelsu || echo "::warning::恢复仓库内 drivers/kernelsu 失败"
            git clean -qfd drivers/kernelsu || true
            if run_build intree ""; then
              rc=0
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              echo "::notice::回退版本编译成功"
            fi
          fi

          # ---- 兜底手段：改内核配置后全量重编 ----
          # .config 在 objtree 里，删 objtree 之前必须先把改好的 config 备份出来
          apply_config() {
            local CFG="$OUT_DIR/.config"
            [ -f "$CFG" ] || CFG=.config
            scripts/config --file "$CFG" "$@" || echo "::warning::scripts/config 调整失败"
            cp "$CFG" /tmp/ci-config-keep 2>/dev/null || true
            if [ -n "$OUT_DIR" ] && [ "$OUT_DIR" != "$PWD" ] && [ "${OUT_DIR#/}" != "$OUT_DIR" ]; then
              rm -rf "$OUT_DIR" && mkdir -p "$OUT_DIR"
            fi
            cp /tmp/ci-config-keep "$OUT_DIR/.config" 2>/dev/null || true
            make $MAKE_ARGS olddefconfig > build-olddefconfig.log 2>&1 || tail -n 20 build-olddefconfig.log || true
          }

          # 第三招：关掉 LTO。编译期的 canary 参数本来是对的（诊断已证实），是被 ld.lld 的
          # LTO 代码生成阶段丢掉的（AOSP clang 17.0.2 没把它带进 LTO），关掉 LTO 正好绕过。
          if [ "$rc" -ne 0 ]; then
            echo "::warning::疑似 LTO 代码生成阶段丢掉了 canary 设置，尝试关闭 LTO 全量重编"
            apply_config --disable LTO_CLANG_FULL --disable LTO_CLANG_THIN --disable LTO_CLANG --disable LTO --enable LTO_NONE
            if run_build nolto "$KSU_ARGS"; then
              rc=0
              echo "nolto=true" >> "$GITHUB_OUTPUT"
              echo "::notice::关闭 LTO 后编译成功"
            fi
          fi

          # 第四招（最后）：连 stack protector / shadow call stack 一起关，彻底不需要 canary
          if [ "$rc" -ne 0 ]; then
            echo "::warning::最后一次尝试：关闭 stack protector / shadow call stack 重编"
            apply_config --disable STACKPROTECTOR_STRONG --disable STACKPROTECTOR --disable SHADOW_CALL_STACK
            if run_build nossp "$KSU_ARGS"; then
              rc=0
              echo "nossp=true" >> "$GITHUB_OUTPUT"
              echo "::notice::关闭 stack protector 后编译成功（无栈保护的兜底产物）"
            fi
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::编译失败，完整日志见构建产物"
            echo "::notice title=disk-after-build::$(df -h / | tail -1)"
            for f in build-synced.log build-intree.log build-nolto.log build-nossp.log; do
              [ -f "$f" ] || continue
              echo "---------- $f 关键错误 ----------"
              grep -nE "error:|fatal error|Error [0-9]+|No space left|cannot find|undefined reference|is not available" "$f" | tail -n 20 || true
              echo "---------- $f 末尾 40 行 ----------"
              tail -n 40 "$f" || true
              # 把关键错误发成 annotation：这样没有仓库权限也能通过 check-run API 读到
              grep -m3 -E "error:|fatal error|No space left on device|Error [0-9]+" "$f" 2>/dev/null | head -3 | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g' | cut -c1-400)
                echo "::error title=${f}::${safe}"
              done || true
            done
            exit 1
          fi

          ls -lh "$OUT_DIR/arch/arm64/boot/Image.lz4"

      - name: Package AnyKernel3 zip
        id: package
        env:
          KSU_SHA: ${{ steps.ksu.outputs.sha }}
          NOLTO: ${{ steps.build.outputs.nolto }}
          NOSSP: ${{ steps.build.outputs.nossp }}
          SUSFS_ON: ${{ steps.susfs.outputs.susfs }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          NAME="blu_spark-ci_$(date +%Y%m%d)_${SHORT_SHA}"
          [ "${NOLTO:-}" = "true" ] && NAME="${NAME}-nolto"
          [ "${NOSSP:-}" = "true" ] && NAME="${NAME}-nossp"
          [ "${SUSFS_ON:-}" = "true" ] && NAME="${NAME}-susfs"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # AK3 的 tools 必须是 aarch64！Pixel 6/7/8/9（Tensor）是纯 64 位系统，跑不了
          # 32 位 ARM 二进制；而 osm0sis/AnyKernel3（以及 engstk/AnyKernel3）仓库自带的
          # busybox/magiskboot/magiskpolicy 都是 32 位 ARM，zip 里带上它们会直接刷不进去：
          #   .../files/busybox: inaccessible or not found
          # 所以直接拿 engstk 官方 release 的 AK3 包当基底（他的 tools/META-INF 是 aarch64），
          # 只把 Image.lz4 和 anykernel.sh 换成我们编出来的。
          BASE_URL=$(curl -fsSL "https://api.github.com/repos/engstk/gs/releases/latest" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);z=[x['browser_download_url'] for x in d.get('assets',[]) if x['name'].endswith('.zip')];p=[u for u in z if '-los' in u] or [u for u in z if '-susfs' not in u and '-next' not in u] or z;print(p[0] if p else '')")
          if [ -z "$BASE_URL" ]; then
            echo "::error::拿不到 engstk 官方 AK3 包地址（网络问题或 release 结构变化）"
            exit 1
          fi
          echo "::notice title=ak3-base::${BASE_URL##*/}"
          curl -fsSL -o /tmp/ak3base.zip "$BASE_URL"
          rm -rf /tmp/ak3-zip && mkdir -p /tmp/ak3-zip
          unzip -o -q /tmp/ak3base.zip -d /tmp/ak3-zip
          rm -f /tmp/ak3-zip/anykernel.sh
          cp .github/ak3/anykernel.sh /tmp/ak3-zip/anykernel.sh
          cp .github/ak3/banner /tmp/ak3-zip/banner
          cp "$OUT_DIR/arch/arm64/boot/Image.lz4" /tmp/ak3-zip/Image.lz4

          # 架构硬检查：打包前确认 tools 是 64 位，别再产出刷不进去的包
          file /tmp/ak3-zip/tools/busybox | grep -q "32-bit" && {
            echo "::error::AK3 tools/busybox 是 32 位 ARM，Pixel 上无法执行，拒绝打包"
            exit 1
          }
          echo "::notice title=ak3-tools::$(file -b /tmp/ak3-zip/tools/busybox)"

          ( cd /tmp/ak3-zip && zip -r9 -q "$GITHUB_WORKSPACE/$NAME.zip" . \
              -x 'modules/*' 'patch/*' 'ramdisk/*' '.github/*' '.gitignore' )
          sha1sum "$NAME.zip" > "$NAME.zip.sha1"
          cat > README-如何刷机.txt <<'EOF'
          GitHub 的 artifact 下载下来是一个「外壳 zip」，里面才是真正的刷机包。

          请先解压下载到的 artifact，再用里面的 ${NAME}.zip 刷机：
            - Kernel Flasher / Horizon Kernel Flasher 直接刷该 zip
            - 刷前先备份 boot
            - 包结构：anykernel.sh + Image.lz4 + tools/ + META-INF/

          想一步到位：手动触发时把 release 选成 true，产物会直接挂到
          GitHub Releases 页面，手机点一下就能下载（不用解压外壳）。
          EOF
          unzip -l "$NAME.zip"

      - name: Package SUSFS userspace module
        id: susfs_module
        if: github.event_name == 'workflow_dispatch' && inputs.susfs == 'true'
        run: |
          set -euo pipefail
          # 官方仓库里已经带了预编译的 aarch64 ksu_susfs，不需要 NDK；
          # 这里只要按 KernelSU 模块格式（module.prop 在 zip 根目录）打包
          cd /tmp/susfs4ksu/ksu_module_susfs
          MODVER=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          ZIP="susfs4ksu-${MODVER}-ksu.zip"
          rm -f "$GITHUB_WORKSPACE/$ZIP"
          zip -r9 -q "$GITHUB_WORKSPACE/$ZIP" .
          ( cd "$GITHUB_WORKSPACE" && sha1sum "$ZIP" > "$ZIP.sha1" )
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"
          unzip -l "$GITHUB_WORKSPACE/$ZIP" | tail -6

      - name: Stage artifacts
        run: |
          set -euo pipefail
          # 扁平化：把所有产物拷进一个目录再上传，artifact 里就不会再出现
          # home/runner/work/... 或 tmp/out_gs/... 这种绝对路径层级（容易让人误当成刷机包）
          STAGE="$GITHUB_WORKSPACE/artifact-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "${{ steps.package.outputs.name }}.zip" "${{ steps.package.outputs.name }}.zip.sha1" "$STAGE/"
          cp "$OUT_DIR/arch/arm64/boot/Image.lz4" "$OUT_DIR/System.map" "$STAGE/"
          cp README-如何刷机.txt "$STAGE/" 2>/dev/null || true
          cp build-*.log "$STAGE/" 2>/dev/null || true
          cp susfs4ksu-*.zip susfs4ksu-*.zip.sha1 "$STAGE/" 2>/dev/null || true
          ls -lh "$STAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: artifact-stage/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSU_SHA: ${{ steps.ksu.outputs.sha }}
        run: |
          set -euo pipefail
          NAME="${{ steps.package.outputs.name }}"
          {
            echo "Automatic CI build of \`blu_spark-16-los\` ($(git rev-parse --short=12 HEAD))"
            echo
            echo "- defconfig: \`$DEFCONFIG\`"
            echo "- toolchain: \`$CLANG_VERSION\`"
            echo "- KernelSU: \`${KSU_SHA:-in-tree}\`"
            echo "- Image.lz4 sha1: \`$(sha1sum "$OUT_DIR/arch/arm64/boot/Image.lz4" | cut -d' ' -f1)\`"
            echo
            echo "Flash the zip with Kernel Flasher / Horizon Kernel Flasher / recovery."
          } > /tmp/release-notes.md
          FILES=("${NAME}.zip" "${NAME}.zip.sha1" "$OUT_DIR/arch/arm64/boot/Image.lz4")
          # susfs 构建时把用户态模块也一起挂上
          [ -n "${{ steps.susfs_module.outputs.name }}" ] && FILES+=("${{ steps.susfs_module.outputs.name }}" "${{ steps.susfs_module.outputs.name }}.sha1")
          gh release create "$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NAME" \
            --notes-file /tmp/release-notes.md \
            "${FILES[@]}"
